name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.x'
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
          go mod download
        working-directory: src

      - name: Build
        run: go build -v .
        working-directory: src

      - name: Test
        run: go test -v ./...
        working-directory: src
